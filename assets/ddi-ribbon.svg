<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">HIV awareness ribbon and drug interaction visual</title>
  <desc id="desc">A clearly recognizable red HIV awareness ribbon, with restrained ART and concomitant-drug symbols and bidirectional interaction cues.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17212c"/>
      <stop offset="1" stop-color="#0d141b"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8d82"/>
      <stop offset=".5" stop-color="#e36b5d"/>
      <stop offset="1" stop-color="#a83b35"/>
    </linearGradient>
    <linearGradient id="capsuleA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e36b5d"/>
      <stop offset="1" stop-color="#f3d5cf"/>
    </linearGradient>
    <linearGradient id="capsuleB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef2f5"/>
      <stop offset="1" stop-color="#79aef4"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity=".30"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e36b5d"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6aa8f5"/>
    </marker>
  </defs>

  <rect x="44" y="36" width="672" height="488" rx="48" fill="url(#bg)" stroke="#2a3440" stroke-width="2"/>
  <circle cx="380" cy="274" r="210" fill="#e36b5d" opacity=".06"/>
  <circle cx="380" cy="274" r="176" fill="none" stroke="#2b3743" stroke-width="1.5" stroke-dasharray="4 10"/>
  <circle cx="380" cy="274" r="236" fill="none" stroke="#25313d" stroke-width="1" stroke-dasharray="2 12"/>

  <!-- recognizable HIV awareness ribbon -->
  <g fill="none" stroke="url(#ribbon)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M333 91
             C278 129 253 187 277 235
             C298 277 345 292 380 324
             C426 366 439 421 399 476"/>
    <path d="M427 91
             C482 129 507 187 483 235
             C462 277 415 292 380 324
             C334 366 321 421 361 476"/>
  </g>
  <path d="M380 78 C350 111 335 150 337 186" fill="none" stroke="#ffd8d2" stroke-opacity=".42" stroke-width="3" stroke-linecap="round"/>

  <!-- subtle DDI connectors -->
  <path d="M210 335 C270 300 324 293 368 305"
        fill="none" stroke="#e36b5d" stroke-width="9" stroke-linecap="round" marker-end="url(#arrowRed)"/>
  <path d="M552 215 C491 249 438 257 392 246"
        fill="none" stroke="#6aa8f5" stroke-width="9" stroke-linecap="round" marker-end="url(#arrowBlue)"/>

  <!-- ART symbol -->
  <g transform="translate(126 270) rotate(9 86 28)" filter="url(#softGlow)">
    <rect x="0" y="0" width="172" height="56" rx="28" fill="#0f151c" stroke="#2e3945" stroke-width="2"/>
    <path d="M28 0 H86 V56 H28 A28 28 0 0 1 28 0Z" fill="url(#capsuleA)"/>
    <path d="M86 0 H144 A28 28 0 0 1 144 56 H86Z" fill="#f2e4e1"/>
    <rect x="84" y="0" width="3" height="56" fill="#5c413d" opacity=".35"/>
    <text x="117" y="35" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="17" font-weight="900" fill="#28333d">ART</text>
  </g>

  <!-- concomitant drug symbol -->
  <g transform="translate(462 294) rotate(-10 86 28)" filter="url(#softGlow)">
    <rect x="0" y="0" width="172" height="56" rx="28" fill="#0f151c" stroke="#2e3945" stroke-width="2"/>
    <path d="M28 0 H86 V56 H28 A28 28 0 0 1 28 0Z" fill="#f4f6f8"/>
    <path d="M86 0 H144 A28 28 0 0 1 144 56 H86Z" fill="url(#capsuleB)"/>
    <rect x="84" y="0" width="3" height="56" fill="#314866" opacity=".38"/>
    <text x="86" y="34" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif" font-size="10" font-weight="800" fill="#65727e">CO-MED</text>
  </g>

  <!-- small clinical nodes -->
  <g fill="#b9c3cc">
    <circle cx="165" cy="184" r="4"/><circle cx="218" cy="131" r="3"/>
    <circle cx="594" cy="167" r="4"/><circle cx="641" cy="388" r="3"/>
    <circle cx="204" cy="428" r="3"/><circle cx="560" cy="438" r="4"/>
  </g>
  <g fill="none" stroke="#33404d" stroke-width="1.2">
    <path d="M165 184 C236 82 507 80 594 167"/>
    <path d="M204 428 C303 512 475 510 641 388"/>
  </g>
</svg>