<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; background:#111; }
#app { min-height:100vh; width:100%; background-color:light-dark(#f4f1ec,#121315); color:light-dark(#222429,#f1f2f4); }
.shell { min-height:100vh; display:grid; grid-template-rows:auto 1fr auto; }
.topbar { display:flex; align-items:center; gap:12px; padding:12px 22px; border-bottom:1px solid light-dark(#d9d4cc,#2a2d31); background:light-dark(#faf8f4,#17191c); position:sticky; top:0; z-index:10; }
.brand { font-weight:800; letter-spacing:.04em; }
.badge,.key,.tag { border:1px solid light-dark(#c8c0b7,#393d42); border-radius:999px; padding:5px 9px; font-size:12px; }
.top-spacer{flex:1}.timer{font-weight:900;font-variant-numeric:tabular-nums}.timer.running{color:light-dark(#9c2f2f,#f19a93)}
.icon-btn,.ctrl,.nav-btn,.poll-btn{border:1px solid light-dark(#d2ccc4,#35393e);background:light-dark(#fffdfa,#1d2024);color:inherit;border-radius:10px;padding:8px 12px;cursor:pointer}
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0}
.deck{min-width:0;min-height:0}.slide{padding:42px 56px 28px;overflow:auto;display:none}.slide.active{display:block}
h1{font-size:clamp(42px,6vw,76px);line-height:1.04;margin:0 0 18px;letter-spacing:-.04em}
h2{font-size:clamp(28px,3.3vw,46px);line-height:1.12;margin:0 0 22px}
h3{font-size:22px;margin:0 0 10px}p{font-size:18px;line-height:1.65}.lead{font-size:clamp(22px,2.3vw,31px);line-height:1.45}
.eyebrow{color:light-dark(#9c2f2f,#f19a93);font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.grid{display:grid;gap:16px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.card,.step,.ref-item{padding:20px;border-radius:16px;background:light-dark(#fffdfa,#1c1f23);border:1px solid light-dark(#ded8cf,#30343a)}
.danger{background:light-dark(#f8e5e0,#342022);border-color:light-dark(#e4bdb4,#6c3938)}
.warn{background:light-dark(#f4ecd5,#312d20);border-color:light-dark(#dac68e,#655b38)}
.soft{background:light-dark(#f8f5f0,#181a1e)}
.big-number{font-size:44px;font-weight:900}.callout{margin-top:16px;padding:18px 20px;border-left:5px solid light-dark(#a8322f,#e27971);border-radius:10px;background:light-dark(#fffaf7,#21191a)}
.workflow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.step{min-height:110px;padding:16px 12px}.step .n{font-weight:900;font-size:12px;opacity:.65}.step b{display:block;margin:5px 0 7px}
.kpi{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px}.kpi .item{min-width:150px}.kpi .v{font-size:29px;font-weight:900}.kpi .l{font-size:12px;opacity:.65}
.quick-nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.nav-btn{border-radius:999px;font-weight:800}
.poll-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.poll-btn{text-align:left;padding:17px 18px;font-size:17px;position:relative;overflow:hidden}.poll-btn .bar{position:absolute;inset:auto 0 0 0;height:4px;background:light-dark(#a8322f,#e27971);width:0;transition:width .2s}.count{float:right;opacity:.7;font-weight:800}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.answer{margin-top:16px;padding:20px;border-radius:16px;background:light-dark(#e9f1eb,#1c2c23);border:1px solid light-dark(#bfd6c3,#3d5a46);display:none}.answer.show{display:block}
.reveal-block{padding:16px 18px;border-radius:12px;background:light-dark(#f6f3ee,#1a1d21);border:1px dashed light-dark(#cbc3b9,#3a3e45);margin-top:10px;display:none}.reveal-block.show{display:block}
.notes-panel{border-left:1px solid light-dark(#d9d4cc,#2a2d31);background:light-dark(#fbfaf7,#17191c);padding:20px;overflow:auto}.notes-title{font-weight:900;margin-bottom:8px}.notes{font-size:14px;line-height:1.65}.notes-panel.hidden{display:none}
.footer{display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid light-dark(#d9d4cc,#2a2d31);background:light-dark(#faf8f4,#17191c)}.progress{flex:1;height:5px;background:light-dark(#e0dbd3,#2b2f34);border-radius:999px;overflow:hidden}.progress>div{height:100%;background:light-dark(#a8322f,#e27971);width:0;transition:width .2s}.slide-count{font-size:12px;opacity:.65;min-width:56px;text-align:right}
@media(max-width:900px){.main{grid-template-columns:1fr}.notes-panel{display:none}.slide{padding:28px 24px 20px}.two,.three,.four,.poll-options{grid-template-columns:1fr}.workflow{grid-template-columns:1fr}.topbar{padding:10px 12px;flex-wrap:wrap}}
</style>

<body>
<div id="app"><div class="shell">
<header class="topbar"><div class="brand">差一步就危險｜HIV × STI DDI 實戰解析</div><span class="badge">35 MIN · Presenter Edition</span><div class="top-spacer"></div><div id="timer" class="timer">35:00</div><button class="icon-btn" id="notesToggle">講者模式 <span class="key">P</span></button><button class="icon-btn" id="fullscreenBtn">全螢幕 <span class="key">F</span></button><button class="icon-btn" id="startBtn">開始演講 <span class="key">S</span></button></header>
<main class="main"><section class="deck" id="deck"></section><aside class="notes-panel" id="notesPanel"><div class="notes-title">講者備忘</div><div class="notes" id="notes"></div></aside></main>
<footer class="footer"><button class="ctrl" id="prevBtn">← 上一頁</button><button class="ctrl" id="nextBtn">下一頁 →</button><div class="progress"><div id="progressBar"></div></div><div class="slide-count" id="slideCount">1 / 1</div><button class="ctrl" id="resetPolls">重設本頁投票</button></footer>
</div></div>
<script>
const slides=[
{html:`<div class="eyebrow">亞東紀念醫院 藥學部｜感染科</div><h1>差一步就危險</h1><p class="lead">愛滋與性病治療常見藥物交互作用實戰解析</p><div class="kpi"><div class="item"><div class="v">35 min</div><div class="l">研討會演講</div></div><div class="item"><div class="v">HIV × STI</div><div class="l">從 ART 到 ChemSex</div></div><div class="item"><div class="v">Case Q&A</div><div class="l">最後 4 分鐘互動驗收</div></div></div><div class="callout"><b>張維倫（小風）藥師</b><br>亞東紀念醫院 藥學部｜感染科臨床藥師</div><div class="quick-nav"><button class="nav-btn" data-goto="4">先看 DDI Framework</button><button class="nav-btn" data-goto="5">認識 4 個 ART fingerprints</button><button class="nav-btn" data-goto="11">看高風險臨床場景</button><button class="nav-btn" data-goto="19">直接挑戰 Final Case</button></div>`,notes:'開場：今天不是背 interaction table，而是練習什麼時候想到 DDI、想到後怎麼處理。'},
{html:`<h2>35 分鐘，不做 DDI 大全</h2><div class="workflow"><div class="step"><b>0–3 min</b>Opening</div><div class="step"><b>3–7 min</b>DDI Framework</div><div class="step"><b>7–11 min</b>4 fingerprints</div><div class="step"><b>11–22 min</b>高風險場景</div><div class="step"><b>22–35 min</b>STI × ChemSex × Final Case</div></div>`,notes:'路線：前 30 分鐘教方法，最後 5 分鐘讓 audience 自己判斷。'},
{html:`<div class="eyebrow">Opening Poll</div><h2>看到 HIV patient 開始新藥，你第一個反應是什麼？</h2><div class="poll" data-poll="opening"><div class="poll-options"><button class="poll-btn">A．先確認 ART regimen<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">B．先看 renal / hepatic function<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">C．先看 CYP substrate / inhibitor<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">D．完整 medication history<span class="count">0</span><span class="bar"></span></button></div><div class="controls"><button class="ctrl" data-answer="openingA">揭示今天的方向</button></div><div id="openingA" class="answer"><b>今天的核心不是四選一。</b><br>完整 medication history → ART fingerprint → high-stakes drug → benefit/risk → management → monitoring。</div></div>`,notes:'目的：讓 audience 開始思考 DDI 是 medication list 與 ART regimen recognition 的問題。'},
{html:`<h2>ART 處方簡化 ≠ DDI 消失</h2><div class="grid three"><div class="card"><div class="big-number">01</div><h3>Longer lifespan</h3><p>HIV care 進入長期慢性病照護，comorbidity 增加。</p></div><div class="card"><div class="big-number">02</div><h3>Additional medications</h3><p>CV、metabolic、CNS、steroid、STI treatment 等藥物逐步加入。</p></div><div class="card danger"><div class="big-number">03</div><h3>DDI consequence</h3><p>Exposure ↑/↓ → toxicity、treatment failure、therapeutic response 改變。</p></div></div>`,notes:'沿用原教材 page 5–9 的故事線。'},
{html:`<h2>看到 interaction，下一句要問什麼？</h2><div class="workflow"><div class="step"><div class="n">01</div><b>Recognize</b>ART regimen / risky drug / vulnerable patient</div><div class="step"><div class="n">02</div><b>Mechanism</b>PK？PD？CYP？UGT？transporter？</div><div class="step"><div class="n">03</div><b>Consequence</b>toxicity / loss of efficacy / resistance / disease event</div><div class="step"><div class="n">04</div><b>Action</b>avoid / substitute / dose-adjust / separate / monitor</div><div class="step"><div class="n">05</div><b>Follow-up</b>症狀、lab、drug level、viral load</div></div><div class="callout"><b>Risk × Benefit</b><br>同時有兩個藥 vs. 沒有其中一個藥，各自帶來什麼風險？</div>`,notes:'全場最重要的 framework。interaction checker 提供資料，臨床決策仍是 patient-specific。'},
{html:`<h2>4 個 ART fingerprints</h2><div class="grid four"><div class="card danger"><span class="tag">Booster</span><h3>DRV/c、DRV/r</h3><p>CYP3A inhibition。</p></div><div class="card warn"><span class="tag">RPV</span><h3>Oral / IM</h3><p>胃酸、food、QTc。</p></div><div class="card"><span class="tag">INSTI</span><h3>DTG / BIC</h3><p>Polyvalent cation、metformin。</p></div><div class="card"><span class="tag">Long-acting</span><h3>CAB/RPV / LEN</h3><p>Persistent exposure。</p></div></div><div class="quick-nav"><button class="nav-btn" data-fp="booster">Booster</button><button class="nav-btn" data-fp="rpv">RPV</button><button class="nav-btn" data-fp="insti">INSTI</button><button class="nav-btn" data-fp="la">Long-acting</button></div><div class="card" id="fpPanel" style="margin-top:16px"><h3 id="fpTitle">Booster｜DRV/c、DRV/r</h3><p id="fpBody">先想 CYP3A inhibition，再掃描 ergot derivatives、PDE-5 inhibitors、部分 anticoagulant / antiplatelet / statin / antiarrhythmic。</p></div>`,notes:'網站版互動：點選 fingerprint，直接顯示臨床先想到的問題。'},
{html:`<h2>看到 COBI / RTV，先想 CYP3A4</h2><div class="grid two"><div class="card danger"><h3>Ergot derivatives</h3><p>ergotamine / dihydroergotamine → vasospasm、ischemia、ergot toxicity。</p></div><div class="card"><h3>Clinical traps</h3><p>PDE-5 inhibitors、rivaroxaban、ticagrelor、clopidogrel、simvastatin、部分 antiarrhythmics。</p></div></div>`,notes:'看 ART 名稱先拆成 active drug + booster。'},
{html:`<h2>RPV：胃酸 + food + QTc</h2><div class="grid three"><div class="card danger"><h3>Oral RPV + PPI</h3><p>胃酸抑制降低 oral RPV exposure。</p></div><div class="card warn"><h3>Antacid / H2RA</h3><p>需要依時間錯開。</p></div><div class="card"><h3>QTc</h3><p>注意 azithromycin、amiodarone、dronedarone 等 stacking。</p></div></div>`,notes:'同一個成分，不同 dosage form，interaction profile 也可能不同。'},
{html:`<h2>INSTI：interaction 有時不是 ART 出事</h2><div class="grid two"><div class="card"><h3>Polyvalent cations</h3><p>Ca、Mg、Al、Fe 可與 oral INSTIs chelation，影響吸收。</p></div><div class="card warn"><h3>Metformin</h3><p>DTG / BIC 可增加 metformin exposure。</p></div></div><div class="kpi"><div class="item"><div class="v">DTG + metformin</div><div class="l">AUC 約 +79%</div></div><div class="item"><div class="v">BIC + metformin</div><div class="l">AUC 約 +39%</div></div></div>`,notes:'不要只問 metformin 會不會影響 DTG，也要問 DTG 會不會改變 metformin exposure。'},
{html:`<h2>Long-acting：interaction 不一定停藥就結束</h2><div class="grid two"><div class="card"><h3>Oral ART</h3><p>調整 culprit drug / regimen 後，exposure 可隨時間下降。</p></div><div class="card danger"><h3>LA ART</h3><p>depot 已在體內，需要從 half-life 與持續暴露時間思考。</p></div></div>`,notes:'重點是 reversibility。'},
{html:`<div class="eyebrow">Mini-case</div><h2>DTG + metformin：要做什麼？</h2><p class="lead">穩定使用 DTG 50 mg QD，新診斷 diabetes，準備開始 metformin。</p><div class="poll" data-poll="metformin"><div class="poll-options"><button class="poll-btn">A．完全不用查<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">B．可以併用，但留意 metformin exposure 與 renal function<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">C．一定要停 DTG<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">D．只有高劑量才要注意<span class="count">0</span><span class="bar"></span></button></div><div class="controls"><button class="ctrl" data-answer="metA">揭示重點</button></div><div id="metA" class="answer"><b>B</b><br>有 DDI 不等於一定禁止併用；依 renal function、劑量與耐受性個別化。</div></div>`,notes:'練習「有 DDI ≠ 禁止併用」。'},
{html:`<h2>Booster × CV：一次看到三種風險</h2><div class="grid three"><div class="card danger"><h3>Bleeding</h3><p>PI/booster + rivaroxaban。</p></div><div class="card warn"><h3>Platelet effect</h3><p>ticagrelor effect ↑；clopidogrel activation ↓。</p></div><div class="card"><h3>Myopathy</h3><p>Boosted PI 與 simvastatin 等。</p></div></div>`,notes:'重點是 interaction management，不是單純比較哪個藥最好。'},
{html:`<h2>吸的、吃的、打的 steroid，都可能是 DDI</h2><div class="grid two"><div class="card danger"><h3>Boosted PI × inhaled corticosteroid</h3><p>Systemic steroid exposure ↑，可增加 Cushing syndrome / adrenal suppression risk。</p></div><div class="card warn"><h3>RPV × dexamethasone</h3><p>Dexamethasone 可誘導 CYP3A，降低 RPV exposure。</p></div></div>`,notes:'具體處置依 current guideline / label / individual check。'},
{html:`<h2>「性功能藥」也是 medication history</h2><div class="grid three"><div class="card danger"><h3>Sildenafil</h3><p>Boosted PI 可增加 exposure。</p></div><div class="card"><h3>Tadalafil</h3><p>依 indication 與 regimen 個別調整。</p></div><div class="card warn"><h3>Dapoxetine</h3><p>強 CYP3A inhibition 可能增加 exposure。</p></div></div>`,notes:'問：助興？壯陽？網路買的？偶爾吃？'},
{html:`<h2>STI treatment：interaction 也會藏在短療程裡</h2><div class="grid four"><div class="card"><h3>Doxycycline</h3><p>cation / antacid / supplement 錯開。</p></div><div class="card warn"><h3>Azithromycin</h3><p>QTc stacking。</p></div><div class="card"><h3>Metronidazole</h3><p>warfarin / alcohol。</p></div><div class="card danger"><h3>Tecovirimat</h3><p>CYP2C19/2C8 inhibition + CYP3A induction。</p></div></div>`,notes:'短療程不等於沒有 DDI。'},
{html:`<h2>DoxyPEP：administration DDI</h2><div class="grid two"><div class="card"><h3>200 mg within 72 h</h3><p>CDC 2024 建議符合條件者 shared decision-making。</p></div><div class="card danger"><h3>錯開 cation</h3><p>與 dairy、antacid、Ca / Fe / Mg / sodium bicarbonate 至少錯開 2 小時。</p></div></div>`,notes:'把重點拉回藥師的 DDI / administration counseling。'},
{html:`<h2>最後一個 medication list：ChemSex</h2><div class="grid three"><div class="card"><h3>Depressant</h3><p>GHB / GBL、benzodiazepines、opioids。</p></div><div class="card warn"><h3>Stimulant</h3><p>Methamphetamine、cocaine、MDMA。</p></div><div class="card danger"><h3>Unknown</h3><p>來源不明 / 成分不純。</p></div></div><p class="lead">「你問『有沒有吃藥？』，病人理解的可能只有『處方藥』。」</p>`,notes:'維持 nonjudgmental，重點是 medication safety。'},
{html:`<h2>Interaction checker 是工具，不是答案</h2><div class="grid four"><div class="card"><h3>DHHS / NIH</h3><p>Guideline framework。</p></div><div class="card"><h3>EACS v13.0</h3><p>DDI + LA ART + substance use。</p></div><div class="card"><h3>Liverpool HIV</h3><p>Drug-pair assessment。</p></div><div class="card"><h3>Label / PK</h3><p>High-stakes interaction 回看原始資料。</p></div></div><div class="callout"><b>查詢順序：</b>ART regimen → culprit drug → mechanism → magnitude → consequence → management → monitoring。</div>`,notes:'這一張可作為公開網站的資源入口。'},
{html:`<div class="eyebrow">Take-home Message</div><h2>四句話，帶回明天的門診</h2><div class="grid two"><div class="card"><h3>01｜ART 可以簡化，但 DDI 不會自己消失。</h3></div><div class="card"><h3>02｜先看 ART fingerprint：Booster、RPV、INSTI、Long-acting。</h3></div><div class="card"><h3>03｜不要只問「有沒有 interaction」；要問「會出什麼事、怎麼處理」。</h3></div><div class="card danger"><h3>04｜PRN、OTC、supplement、STI treatment、chemsex 都是 medication history。</h3></div></div>`,notes:'停一下，準備最後案例。'},
{html:`<div class="case-title"><span class="tag">FINAL CASE · 4 min</span><h2>最後一關：真的只是 headache 嗎？</h2></div><div class="grid two"><div class="card"><h3>39 y/o Male</h3><p>Multiple drug-resistant HIV<br>Prezcobix (DRV/c) + DTG × 4 years<br>HTN / HLP / Migraine</p></div><div class="card"><h3>今天</h3><p>Headache + nausea + chest tightness<br><b>Day 1</b></p></div></div><div class="reveal"><button class="ctrl" data-reveal="case1">揭露下一幕</button><div id="case1" class="reveal-block"><b>11:30</b> E4V5M6；TPR 36.1/53/18；BP 130/85；SpO2 99%<br><br><b>你現在最想再問哪一件事？</b></div></div>`,notes:'第一幕不要提示 ergotamine。'},
{html:`<div class="eyebrow">Case Q1</div><h2>你現在最想再問什麼？</h2><div class="poll" data-poll="q1"><div class="poll-options"><button class="poll-btn">A．最近 HIV viral load<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">B．PRN / OTC / local clinic medication<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">C．pitavastatin adherence<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">D．今天有沒有吃早餐<span class="count">0</span><span class="bar"></span></button></div><div class="controls"><button class="ctrl" data-answer="q1a">揭示答案</button></div><div id="q1a" class="answer"><b>答案：B</b><br>問近期 migraine 處理、PRN、OTC、保健品與 substance use。</div></div>`,notes:'這題考 history taking。'},
{html:`<div class="eyebrow">Case Q2</div><h2>多透露一點</h2><div class="card"><p>Local clinic prescribed <b>NSAID + ergotamine PRN</b>，共開 3 doses。</p><p>病人實際只吃了 <b>ONE dose ergotamine</b>，之後馬上服用 HAART。</p></div><div class="poll" data-poll="q2"><div class="poll-options"><button class="poll-btn">A．只有 chronic use 才危險<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">B．DRV/c 可讓 ergotamine exposure 大幅上升<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">C．DTG 是主要 culprit<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">D．主要是 NSAID<span class="count">0</span><span class="bar"></span></button></div><div class="controls"><button class="ctrl" data-answer="q2a">揭示答案</button></div><div id="q2a" class="answer"><b>答案：B</b><br>Boosted PI × ergot derivatives 是 high-stakes DDI；只吃一顆不能排除風險。</div></div>`,notes:'「差一步」的第一個 punchline。'},
{html:`<div class="eyebrow">Case Q3</div><h2>事情開始失控</h2><div class="card"><p>12:41：generalized tonic-clonic-like convulsions</p><p>12:45：pulse 不可測 → CPR</p><p>12:48：VF → defibrillation</p><p>12:51：amiodarone 300 mg IV</p></div><div class="poll" data-poll="q3"><div class="poll-options"><button class="poll-btn">A．ART efficacy 問題<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">B．ACS<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">C．Drug-induced vasospasm / ergot toxicity<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">D．Pitavastatin toxicity<span class="count">0</span><span class="bar"></span></button></div><div class="controls"><button class="ctrl" data-answer="q3a">揭示重點</button></div><div id="q3a" class="answer"><b>高度懷疑 ergot-related vasospasm。</b></div></div>`,notes:'先讓大家想 ACS vs vasospasm。'},
{html:`<div class="eyebrow">Case Q4</div><h2>CAG 結果</h2><div class="grid two"><div class="card"><h3>Coronary angiography</h3><p>LMCA：luminal irregularity<br>LAD：40–50% eccentric stenosis + diffuse spasm<br>LCX：diffuse spasm<br>RCA：30–40% + diffuse spasm</p></div><div class="card danger"><h3>Diagnosis</h3><p><b>Insignificant CAD</b><br><b>Coronary spasm</b><br>IHCA s/p ACLS with ROSC</p></div></div><div class="poll" data-poll="q4"><div class="poll-options"><button class="poll-btn">A．Plaque rupture ACS<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">B．Ergotism-associated coronary vasospasm<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">C．DTG neurotoxicity<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">D．NSAID renal toxicity<span class="count">0</span><span class="bar"></span></button></div><div class="controls"><button class="ctrl" data-answer="q4a">揭示答案</button></div><div id="q4a" class="answer"><b>答案：B</b><br>Ergot derivatives 可造成 arterial constriction；冠狀動脈痙攣是病例核心表現。</div></div>`,notes:'攤出 vasospasm 的客觀證據。'},
{html:`<div class="eyebrow">Case Q5</div><h2>第一個 DDI 找到了，事情真的結束了嗎？</h2><div class="card"><p><b>DAPT：aspirin + ticagrelor</b><br><b>Heparin infusion</b></p></div><div class="poll" data-poll="q5"><div class="poll-options"><button class="poll-btn">A．Ticagrelor 也要重新檢視<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">B．Clopidogrel 若替代，也要重新檢視<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">C．只要看 heparin<span class="count">0</span><span class="bar"></span></button><button class="poll-btn">D．A + B<span class="count">0</span><span class="bar"></span></button></div><div class="controls"><button class="ctrl" data-answer="q5a">揭示答案</button></div><div id="q5a" class="answer"><b>答案：D</b><br>Boosted PI 可使 ticagrelor effect ↑；clopidogrel activation 可能 ↓。</div></div>`,notes:'一個 interaction 被發現後，後續藥物仍要重新掃描。'},
{html:`<h2>Ergotamine × boosted PI：把機轉串起來</h2><div class="workflow"><div class="step"><b>DRUG</b>Ergotamine<br>5-HT receptor agonism + partial α-adrenergic agonism</div><div class="step"><b>PK</b>CYP3A4<br>Extensive hepatic metabolism</div><div class="step"><b>ART</b>DRV/c<br>CYP3A inhibition</div><div class="step"><b>PD</b>Vasospasm<br>coronary + peripheral</div><div class="step"><b>EVENT</b>ischemia / arrhythmia / collapse</div></div><div class="callout danger"><b>2011 published case：</b>single 1 mg ergotamine dose 後出現 severe four-limb ischemia；angiography 顯示 diffuse arterial spasm。</div>`,notes:'原案例停用了 ART；MDR HIV 病人的 regimen alteration 應由 HIV specialist / clinical pharmacist 設計。'},
{html:`<h2>研討會參考資料</h2><div class="grid two"><div class="card"><b>DHHS / NIH</b><br>Guidelines for the Use of Antiretroviral Agents in Adults and Adolescents With HIV<br><span class="small">Updated Sep 24, 2026</span></div><div class="card"><b>EACS v13.0</b><br>Ambrosioni J, et al. HIV Med. 2026;27(1):18–32.</div><div class="card"><b>CDC DoxyPEP</b><br>Bachmann LH, et al. MMWR Recomm Rep. 2024;73(RR-2):1–8.</div><div class="card"><b>Ergotamine case</b><br>Marine L, et al. Circulation. 2011;124:1395–1397.</div><div class="card"><b>DTG × metformin</b><br>Dolutegravir–metformin pharmacokinetic study</div><div class="card"><b>Liverpool HIV DDI Checker</b><br>Individual drug-pair assessment resource</div></div>`,notes:'QA 時可讓大家把手機打開 interaction checker。'},
{html:`<div class="eyebrow">Thank you</div><div class="lead">「DDI 最危險的地方，不是 interaction checker 查不到；而是我們沒有想到要查。」</div><div class="callout"><b>張維倫（小風）藥師</b><br>亞東紀念醫院 藥學部｜感染科臨床藥師</div>`,notes:'收尾後進 Q&A。'}
];
let currentSlide=0,timerSeconds=2100,timerHandle=null;
const deck=document.getElementById('deck');
slides.forEach((s,i)=>{const el=document.createElement('article');el.className='slide'+(i===0?' active':'');el.innerHTML=s.html;deck.appendChild(el);});
function updateUI(){document.querySelectorAll('.slide').forEach((e,i)=>e.classList.toggle('active',i===currentSlide));document.getElementById('notes').innerHTML=slides[currentSlide].notes||'';document.getElementById('slideCount').textContent=(currentSlide+1)+' / '+slides.length;document.getElementById('progressBar').style.width=((currentSlide+1)/slides.length*100)+'%';}
function goToSlide(n){currentSlide=Math.max(0,Math.min(slides.length-1,n));updateUI();}
function bars(p){const bs=[...p.querySelectorAll('.poll-btn')],vs=bs.map(b=>Number(b.querySelector('.count').textContent)),t=vs.reduce((a,b)=>a+b,0)||1;bs.forEach((b,i)=>b.querySelector('.bar').style.width=(vs[i]/t*100)+'%');}
function resetPoll(p){p.querySelectorAll('.count').forEach(e=>e.textContent='0');p.querySelectorAll('.bar').forEach(e=>e.style.width='0%');}
document.getElementById('nextBtn').onclick=()=>goToSlide(currentSlide+1);
document.getElementById('prevBtn').onclick=()=>goToSlide(currentSlide-1);
document.getElementById('notesToggle').onclick=()=>document.getElementById('notesPanel').classList.toggle('hidden');
document.getElementById('fullscreenBtn').onclick=()=>document.documentElement.requestFullscreen?.();
document.getElementById('startBtn').onclick=()=>{document.getElementById('notesPanel').classList.add('hidden');document.documentElement.requestFullscreen?.();if(!timerHandle)toggleTimer();};
document.getElementById('resetPolls').onclick=()=>document.querySelectorAll('.slide.active .poll').forEach(resetPoll);
document.querySelectorAll('.poll-btn').forEach(b=>b.onclick=()=>{const p=b.closest('.poll');const c=b.querySelector('.count');c.textContent=Number(c.textContent)+1;bars(p);});
document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.answer)?.classList.add('show'));
document.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.reveal)?.classList.add('show'));
document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>goToSlide(Number(b.dataset.goto)));
const fp={booster:['Booster｜DRV/c、DRV/r','先想 CYP3A inhibition，再掃描 ergot derivatives、PDE-5 inhibitors、部分 anticoagulant / antiplatelet / statin / antiarrhythmic。'],rpv:['RPV｜oral / IM','先想 gastric acid、food、QTc；oral 與 IM 的 interaction profile 不完全相同。'],insti:['INSTI｜DTG / BIC','先想 polyvalent cation chelation，以及 metformin exposure 增加。'],la:['Long-acting｜CAB/RPV / LEN','先想 reversibility：depot 已在體內，interaction 不一定能靠停藥立即歸零。']};
document.querySelectorAll('[data-fp]').forEach(b=>b.onclick=()=>{const d=fp[b.dataset.fp];document.getElementById('fpTitle').textContent=d[0];document.getElementById('fpBody').textContent=d[1];});
function setTimer(){const m=Math.floor(timerSeconds/60),s=timerSeconds%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function toggleTimer(){const t=document.getElementById('timer');if(timerHandle){clearInterval(timerHandle);timerHandle=null;t.classList.remove('running');return;}t.classList.add('running');timerHandle=setInterval(()=>{timerSeconds=Math.max(0,timerSeconds-1);setTimer();if(timerSeconds===0){clearInterval(timerHandle);timerHandle=null;}},1000);}
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','BUTTON'].includes(document.activeElement.tagName)&&e.key!=='Escape')return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();goToSlide(currentSlide+1)}else if(e.key==='ArrowLeft'){e.preventDefault();goToSlide(currentSlide-1)}else if(e.key.toLowerCase()==='p'){document.getElementById('notesPanel').classList.toggle('hidden')}else if(e.key.toLowerCase()==='f'){document.documentElement.requestFullscreen?.()}else if(e.key.toLowerCase()==='s'){document.getElementById('notesPanel').classList.add('hidden');document.documentElement.requestFullscreen?.();if(!timerHandle)toggleTimer()}else if(e.key.toLowerCase()==='t'){toggleTimer()}});
updateUI();setTimer();
</script>
</body>
</html>
